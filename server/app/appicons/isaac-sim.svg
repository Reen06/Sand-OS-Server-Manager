<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Isaac Sim home-screen icon.
       NVIDIA green on the same dark rounded tile the generated icons use, so
       it sits consistently beside the other app icons. Without this file
       pwa.icon_svg() falls back to an initials tile, which is what put a
       generic badge on the home screen instead of something recognisable. -->
  <rect width="512" height="512" rx="112" fill="#12171f"/>
  <rect x="56" y="56" width="400" height="400" rx="96" fill="#76b900"/>
  <g fill="#12171f">
    <!-- simple robot head: visor + antenna, readable at 48px -->
    <rect x="150" y="196" width="212" height="150" rx="34"/>
    <rect x="246" y="146" width="20" height="46" rx="10"/>
    <circle cx="256" cy="136" r="20"/>
  </g>
  <g fill="#76b900">
    <circle cx="212" cy="262" r="24"/>
    <circle cx="300" cy="262" r="24"/>
    <rect x="206" y="304" width="100" height="16" rx="8"/>
  </g>
</svg>
